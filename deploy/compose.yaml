# The Grimoire deployment (contracts/deployment.md): the hub, the egress proxy that is its only
# route out, and an inbound relay so a browser can reach it.
#
#   GRIMOIRE_INTERNAL_TOKEN=$(openssl rand -hex 32) ANTHROPIC_API_KEY=sk-ant-... \
#     docker compose -f deploy/compose.yaml up --build
#   curl -fsS localhost:8080/healthz
#
# Both variables can also live in deploy/.env, which is never committed and never enters a build
# context. The API key reaches the egress proxy and nothing else: the hub holds only the opaque
# internal token (ADR-0010).
#
# Networks. The hub is attached to `internal` alone, which has no route off the host, so the
# proxy is the only thing it can reach that reaches anything else. A container on an internal
# network cannot publish a port, so a browser reaches the hub through `ingress`, a reverse proxy
# sitting on both networks that forwards only *to* the hub. It is inbound plumbing: it holds no
# credential and forwards nothing outward.

name: grimoire

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
    image: grimoire-hub
    # A fixed name is also a fixed count: `--scale hub=2` fails. Exactly one replica is a property
    # of the design — one run at a time, SQLite, one wiki working tree — not a limitation.
    container_name: grimoire-hub
    deploy:
      replicas: 1
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Per-run HOME and scratch; discarded with the container.
    tmpfs:
      - /tmp
    environment:
      GRIMOIRE_WIKI_REPO: /data/wiki
      GRIMOIRE_STATE_DB: /data/state/grimoire.db
      GRIMOIRE_MODEL_BASE_URL: http://egress:8080
      GRIMOIRE_MODEL_TOKEN: ${GRIMOIRE_INTERNAL_TOKEN:?set GRIMOIRE_INTERNAL_TOKEN to an opaque random value}
      GRIMOIRE_FETCH_PROXY: http://egress:8080/fetch
    volumes:
      - wiki:/data/wiki
      - state:/data/state
    networks: [internal]
    # Room for the SIGTERM sequence: drain, terminate the run, settle, reset, exit.
    stop_grace_period: 30s
    depends_on:
      wiki-init:
        condition: service_completed_successfully
      egress:
        condition: service_started

  # The wiki must have a commit before the first ingest. Idempotent: a wiki that has one is left alone.
  wiki-init:
    image: grimoire-hub
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    entrypoint:
      - sh
      - -c
      - >-
        git -C /data/wiki rev-parse --verify HEAD >/dev/null 2>&1
        || { git init --quiet --initial-branch=main /data/wiki
        && git -C /data/wiki -c user.name=Grimoire -c user.email=grimoire@localhost
        commit --quiet --allow-empty -m "Initialise the wiki"; }
    volumes:
      - wiki:/data/wiki

  egress:
    build:
      context: ..
      dockerfile: deploy/egress.Dockerfile
    image: grimoire-egress
    container_name: grimoire-egress
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      GRIMOIRE_EGRESS_MODEL_UPSTREAM: https://api.anthropic.com
      GRIMOIRE_EGRESS_MODEL_CREDENTIAL: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY; only the egress proxy receives it}
      GRIMOIRE_EGRESS_INTERNAL_TOKEN: ${GRIMOIRE_INTERNAL_TOKEN:?set GRIMOIRE_INTERNAL_TOKEN to an opaque random value}
    networks: [internal, outside]

  ingress:
    image: caddy:2-alpine
    command: ["caddy", "reverse-proxy", "--from", ":8080", "--to", "hub:8080"]
    read_only: true
    cap_drop: [ALL]
    # The image's caddy binary carries this file capability, and the kernel refuses to execute it
    # without it. It is the ingress relay's only capability; the hub and the proxy have none.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /config
      - /data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal, outside]
    depends_on: [hub]

networks:
  internal:
    internal: true
  outside: {}

volumes:
  wiki:
  state:
