<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grimoire — submit a text</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 16px/1.5 system-ui, sans-serif;
        margin: 0 auto;
        max-width: 42rem;
        padding: 2rem 1rem;
      }
      h1 { font-size: 1.25rem; font-weight: 600; }
      textarea {
        box-sizing: border-box;
        font: inherit;
        min-height: 14rem;
        padding: 0.6rem;
        resize: vertical;
        width: 100%;
      }
      button { font: inherit; margin-top: 0.75rem; padding: 0.5rem 1.1rem; }
      #message { margin-top: 1rem; min-height: 1.5rem; }
      #message[data-kind="refused"] { color: #b3261e; }
      h2 { font-size: 1rem; font-weight: 600; margin-top: 2.5rem; }
      #submissions { list-style: none; margin: 0; padding: 0; }
      /* Wrapping, because a row carries more than it did: when it held the time, the opening of the
         text and one word, everything fitted on one line. With the model and two figures beside them
         it does not, and the opening was the only item able to give way — it was squeezed to a single
         character, which is exactly what ACCESS-004 asks the browser to show. The run's facts move to
         a second line instead.

         A figure changing cannot re-wrap the row: both figures have a fixed width and the model and
         the opening do not change while a run is under way, so nothing here can change how the lines
         break (ACCESS-005). */
      #submissions li {
        border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        column-gap: 1rem;
        display: flex;
        flex-wrap: wrap;
        padding: 0.5rem 0;
        row-gap: 0.25rem;
      }
      #submissions time { flex: none; font-variant-numeric: tabular-nums; }
      /* Each figure in its own element, with tabular figures and a width kept for it, so that
         1 000 becoming 10 000 moves nothing beside it (ACCESS-005, docs/ux.md: live content grows
         in place). */
      .figure {
        flex: none;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      /* A width rather than a floor, so a figure gaining a digit changes a number and moves nothing
         at all — not the row, and not the state, model or link beside it inside the row (ACCESS-005,
         docs/ux.md: live content grows in place).

         Both widths come from the cost ceiling, which is what bounds either figure: a run is stopped
         at 2 000 000 tokens (GUARD-004), so the token figure cannot pass "2 000 000" — nine
         characters with the thin spaces this page groups them by. Every tool call spends tokens on
         the call and on its result, so the same ceiling bounds the number of calls far below the
         "99 999" six characters hold. Neither is an assumption about how a run behaves; both follow
         from the ceiling it is held to. */
      .tokens { width: 9ch; }
      .calls { width: 6ch; }
      .model { flex: none; opacity: 0.7; }
      /* What the figure beside it counts. Its own element, so the figure holds nothing but the
         number — the thing the cost ceiling counts and nothing else (DEC-015). */
      .unit { flex: none; margin-left: -0.6rem; opacity: 0.7; }
      .open-run { flex: none; margin-left: auto; }
      .missing { flex: none; }
      /* One row per submission however long the text was: the opening is cut to the same length
         for every one of them, and what still will not fit is ended here (ACCESS-004). */
      .excerpt {
        flex: 1 1 18ch;
        min-width: 18ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .state { flex: none; font-weight: 600; }
      .acknowledge { flex: none; font: inherit; margin: 0; padding: 0.1rem 0.6rem; }
    </style>
  </head>
  <body>
    <h1>Submit a text</h1>

    <form id="submission">
      <label for="text">Paste the text you want in the wiki.</label>
      <textarea id="text" name="text" autofocus></textarea>
      <button id="submit" type="submit">Submit</button>
    </form>

    <!-- The run happens without the user: once the text is accepted the browser is free
         (INGEST-001). -->
    <p id="message" role="status" aria-live="polite"></p>

    <h2>What became of each submission</h2>

    <!-- Exactly one of the four states per submission, and — where it has a run — that run's model,
         the tokens it has spent and the tool calls it has made (ACCESS-005). Beside them: when the
         submission was made and the opening of its text, which is what one submission is told from
         another by (ACCESS-004). A row with a run links to that run's record (ACCESS-006). No
         identifier is rendered. -->
    <ul id="submissions"></ul>

    <script src="app.js"></script>
  </body>
</html>
