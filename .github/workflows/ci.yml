name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      # time-budget (Constitution III.7): the default test run is Fast alone, and it fails when
      # Fast exceeds 15 s. --timeout is Microsoft.Testing.Platform's own session timeout; no
      # tooling of our own measures this.
      - name: Fast suite — time-budget 15 s
        run: dotnet test tests/Grimoire.Fast.Tests --no-build --configuration Release -- --timeout 15s

      # The sign-in marker is named once, here: CI has no subscription sign-in, so the three
      # HarnessProcess tests are excluded. They run locally before the PR (research.md R-09).
      #
      - name: Contract suite — time-budget 90 s
        run: dotnet test tests/Grimoire.Contract.Tests --no-build --configuration Release -- --timeout 90s --filter-not-trait "requires=signin"

  # The E2E suite: a real browser against a running hub, driven by Microsoft.Playwright.Xunit.v3.
  # Its own job because the browser install costs more than the suite does, and because nothing
  # else here needs one.
  #
  # It had been built by the job above and never run, which made ACCESS-001 and ACCESS-002 read
  # `proven` in docs/trace.md on the strength of tests that no pipeline executed: trace-check reads
  # the traits off a built assembly, so it can tell that a test exists and not that it passes.
  #
  # No time budget — Constitution III.7 sets one for Fast and Contract only.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      # The bootstrap script the Playwright package drops beside the built assembly. Chromium
      # alone: PageTest uses it unless a test says otherwise, and none does.
      - name: Install the browser
        run: pwsh tests/Grimoire.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E suite
        run: dotnet test tests/Grimoire.E2E.Tests --no-build --configuration Release

  # trace-check (Constitution IV.3): reads the requirement ids and proof kinds from
  # docs/capabilities/ and the level/req traits off the built test assemblies. Writes nothing.
  #
  # Two calls, because IV.3 puts its four conditions in two places. `check` carries the three that
  # hold at any moment — a test with an unknown, retired or reserved id; a test with no level; an
  # E2E or Deploy test with no requirement id — and runs on every push. `check --complete` adds the
  # fourth, a `test` requirement with no test, and runs only where the feature lands on main: a
  # requirement is registered before its test is written (Constitution IV.2), so that one condition
  # is red by construction while a feature is in flight and green where the feature is done, which
  # is also where it counts as done (Constitution I.9).
  trace-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      - name: trace-check
        run: dotnet run --project tools/Grimoire.Trace --no-build --configuration Release -- check

      - name: trace-check --complete
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
        run: dotnet run --project tools/Grimoire.Trace --no-build --configuration Release -- check --complete

  # The three project metrics: requirements proven, line coverage of the Fast suite over the code
  # that holds decisions of ours, and the time it takes to read src/. `scripts/metrics.sh` computes
  # them with existing tools and writes the Markdown table this job puts in the job summary.
  #
  # Not a gate, and no thresholds anywhere: this job fails when a measurement breaks — a tool
  # missing, a report unreadable, a value absent — and never because a value is low. Constitution
  # II.2 makes a gate an amendment; three measurements are not one.
  #
  # On push to main only. A metric of a pull request's branch would be a number to move before the
  # merge, which is what a target is.
  metrics:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Two pushes to main in quick succession would otherwise measure main twice at once, and both
    # runs force-push the same branch: whichever finished last would win, so an older commit's
    # numbers could end up on the badges. One group for the whole repository, and the newer run
    # cancels the older, so what the badges show is always the newest measurement that completed.
    concurrency:
      group: metrics-badges
      cancel-in-progress: true

    # The one job in this workflow that may write, and it writes to the `badges` branch alone.
    # Nothing here commits to main.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The line counter. An existing tool counts the lines (Constitution II.3); nothing of ours
      # distinguishes a comment from a statement.
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install --yes cloc

      # ReportGenerator, from .config/dotnet-tools.json — it filters the coverage report to the
      # projects in scope and sums it.
      - name: Restore the local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      # The script writes the table to stdout and nothing else, so the job summary gets the table
      # and the log gets the tools' own output.
      - name: The three metrics
        env:
          CONFIGURATION: Release
        run: |
          ./scripts/metrics.sh > "$RUNNER_TEMP/metrics.md"
          cat "$RUNNER_TEMP/metrics.md" >> "$GITHUB_STEP_SUMMARY"

      # The three endpoint documents README.md's badges read. A fresh repository in the directory
      # that holds them, force-pushed: the branch is orphan by construction and carries one commit,
      # so the badge history never grows and no measurement can reach a branch anyone develops on.
      - name: Publish the badge documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts/metrics/badges
        run: |
          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.json coverage.json readtime.json
          git commit --quiet --message "metrics of ${GITHUB_SHA}"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
