name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      # time-budget (Constitution III.7): the default test run is Fast alone, and it fails when
      # Fast exceeds 15 s. --timeout is Microsoft.Testing.Platform's own session timeout; no
      # tooling of our own measures this.
      - name: Fast suite — time-budget 15 s
        run: dotnet test tests/Grimoire.Fast.Tests --no-build --configuration Release -- --timeout 15s

      # The sign-in marker is named once, here: CI has no subscription sign-in, so the three
      # HarnessProcess tests are excluded. They run locally before the PR (research.md R-09).
      #
      - name: Contract suite — time-budget 90 s
        run: dotnet test tests/Grimoire.Contract.Tests --no-build --configuration Release -- --timeout 90s --filter-not-trait "requires=signin"

  # The E2E suite: a real browser against a running hub, driven by Microsoft.Playwright.Xunit.v3.
  # Its own job because the browser install costs more than the suite does, and because nothing
  # else here needs one.
  #
  # It had been built by the job above and never run, which made ACCESS-001 and ACCESS-002 read
  # `proven` in docs/trace.md on the strength of tests that no pipeline executed: trace-check reads
  # the traits off a built assembly, so it can tell that a test exists and not that it passes.
  #
  # No time budget — Constitution III.7 sets one for Fast and Contract only.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      # The bootstrap script the Playwright package drops beside the built assembly. Chromium
      # alone: PageTest uses it unless a test says otherwise, and none does.
      - name: Install the browser
        run: pwsh tests/Grimoire.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E suite
        run: dotnet test tests/Grimoire.E2E.Tests --no-build --configuration Release

  # trace-check (Constitution IV.3): reads the requirement ids and proof kinds from
  # docs/capabilities/ and the level/req traits off the built test assemblies. Writes nothing.
  #
  # Two calls, because IV.3 puts its four conditions in two places. `check` carries the three that
  # hold at any moment — a test with an unknown, retired or reserved id; a test with no level; an
  # E2E or Deploy test with no requirement id — and runs on every push. `check --complete` adds the
  # fourth, a `test` requirement with no test, and runs only where the feature lands on main: a
  # requirement is registered before its test is written (Constitution IV.2), so that one condition
  # is red by construction while a feature is in flight and green where the feature is done, which
  # is also where it counts as done (Constitution I.9).
  trace-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      - name: trace-check
        run: dotnet run --project tools/Grimoire.Trace --no-build --configuration Release -- check

      - name: trace-check --complete
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
        run: dotnet run --project tools/Grimoire.Trace --no-build --configuration Release -- check --complete

  # The three project metrics: requirements proven, line coverage of the Fast suite over the code
  # that holds decisions of ours, and the time it takes to read src/. `scripts/metrics.sh` computes
  # them with existing tools and writes the Markdown table this job puts in the job summary.
  #
  # Not a gate, and no thresholds anywhere: this job fails when a measurement breaks — a tool
  # missing, a report unreadable, a value absent — and never because a value is low. Constitution
  # II.2 makes a gate an amendment; three measurements are not one.
  #
  # On push to main only. A metric of a pull request's branch would be a number to move before the
  # merge, which is what a target is.
  metrics:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Two pushes to main in quick succession would otherwise measure main twice at once, and both
    # runs force-push the same branch: whichever finished last would win, so an older commit's
    # numbers could end up on the badges. One group for the whole repository, and the newer run
    # cancels the older, so what the badges show is always the newest measurement that completed.
    concurrency:
      group: metrics-badges
      cancel-in-progress: true

    # The one job in this workflow that may write, and it writes to the `badges` branch alone.
    # Nothing here commits to main.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The line counter. An existing tool counts the lines (Constitution II.3); nothing of ours
      # distinguishes a comment from a statement.
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install --yes cloc

      # ReportGenerator, from .config/dotnet-tools.json — it filters the coverage report to the
      # projects in scope and sums it.
      - name: Restore the local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Grimoire.slnx --configuration Release

      # The script writes the table to stdout and nothing else, so the job summary gets the table
      # and the log gets the tools' own output.
      - name: The three metrics
        env:
          CONFIGURATION: Release
        run: |
          ./scripts/metrics.sh > "$RUNNER_TEMP/metrics.md"
          cat "$RUNNER_TEMP/metrics.md" >> "$GITHUB_STEP_SUMMARY"

      # The mutation badge document belongs to the `mutation` job below, which runs on a different
      # trigger and writes to the same branch. The push under this step replaces that branch
      # wholesale, so whatever that job last published is read back in here and carried forward.
      # Neither failure is one: on the first run the branch does not exist, and until the first
      # mutation run on main the document does not either.
      - name: Carry the mutation badge document forward
        run: |
          git fetch --depth=1 origin badges 2>/dev/null || exit 0
          if git show origin/badges:mutation.json > "$RUNNER_TEMP/mutation.json" 2>/dev/null; then
            mv "$RUNNER_TEMP/mutation.json" artifacts/metrics/badges/mutation.json
          fi

      # The endpoint documents README.md's badges read. A fresh repository in the directory
      # that holds them, force-pushed: the branch is orphan by construction and carries one commit,
      # so the badge history never grows and no measurement can reach a branch anyone develops on.
      - name: Publish the badge documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts/metrics/badges
        run: |
          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "metrics of ${GITHUB_SHA}"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # The mutation measurement: `scripts/mutation.sh`, one Stryker run per project in scope, the Fast
  # suite alone. It produces the reports a person reads to classify the survivors — which is why the
  # reports are uploaded whole, and why the job summary is four lines of arithmetic over them and
  # nothing more. Nothing here classifies anything.
  #
  # Not a gate. There is no threshold in this job and no comparison with a previous run: it fails
  # when the measurement is invalid, never because a score is low. Two things make it invalid, and
  # both are read out of the report with jq (Constitution II.3 — the existing tool; nothing of ours
  # beyond mutation.sh):
  #
  #   - a project in scope with no tested mutant at all. Stryker then reports a score computed over
  #     nothing, or none, and the run said nothing about that project.
  #   - a `--mutate` entry in mutation.sh naming a file that no longer exists. Stryker lists every
  #     source file of the project it runs on, whether the entry selected it or excluded it, so a
  #     named file missing from the report is a scope entry that has stopped selecting anything —
  #     silently, and in the direction of measuring less.
  #
  # On pull requests to main and on workflow_dispatch, and on no other event. A Stryker run costs
  # minutes per project; on every push it would be paid for on every commit of every branch, for a
  # number nobody reads until the PR. It is not in `build-and-test` for the same reason the metrics
  # are not: a measurement must not hold up the gates.
  mutation:
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')

    runs-on: ubuntu-latest

    # Written to only by the badge step below, and only on main. Every other run of this job pushes
    # nothing.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Stryker builds the solution it mutates itself (Grimoire.Mutation.slnx, from
      # stryker-config.json), so there is no `dotnet build` here and no --no-build to pass. The
      # script restores the local tools.
      - name: The mutation measurement
        run: ./scripts/mutation.sh

      # The artifact the closing task of a feature classifies its survivors from. Uploaded whether
      # or not the checks below pass — an invalid measurement is still the thing you have to look at
      # to see why.
      - name: Upload the mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: StrykerOutput/*/reports/mutation-report.json
          if-no-files-found: error

      # Created is every mutant in the report, the ones a scope entry excluded included; tested is
      # the ones a test actually ran against (killed, survived, timed out); not covered is the ones
      # no test reaches. Score is Stryker's own: detected over valid, where detected is killed plus
      # timed out and valid is those plus survived plus not covered.
      - name: The table
        run: |
          {
            echo "| Project | Created | Tested | Not covered | Score |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            for report in StrykerOutput/*/reports/mutation-report.json; do
              jq -r --arg project "$(basename "$(dirname "$(dirname "$report")")")" '
                [.files[].mutants[].status] as $status
                | ($status | map(select(. == "Killed")) | length) as $killed
                | ($status | map(select(. == "Timeout")) | length) as $timeout
                | ($status | map(select(. == "Survived")) | length) as $survived
                | ($status | map(select(. == "NoCoverage")) | length) as $uncovered
                | ($killed + $timeout + $survived + $uncovered) as $valid
                | "| \($project) | \($status | length) | \($killed + $timeout + $survived) | \($uncovered) | "
                  + (if $valid == 0 then "none" else "\((($killed + $timeout) * 1000 / $valid | round) / 10)%" end)
                  + " |"
              ' "$report"
            done
            echo
            echo "A measurement, not a gate: no value here can fail this job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The measurement is valid
        run: |
          invalid=0

          for report in StrykerOutput/*/reports/mutation-report.json; do
            project=$(basename "$(dirname "$(dirname "$report")")")
            tested=$(jq '[.files[].mutants[].status
                          | select(. == "Killed" or . == "Timeout" or . == "Survived")] | length' "$report")
            if [ "$tested" -eq 0 ]; then
              echo "::error::$project is in scope and no mutant of it was tested"
              invalid=1
            fi
          done

          jq -r '.files | keys[]' StrykerOutput/*/reports/mutation-report.json > "$RUNNER_TEMP/mutated.txt"

          # Every --mutate entry of mutation.sh that names a .cs file, selecting it or excluding it.
          grep -oE -- "--mutate '!?\*\*/[^']+\.cs'" scripts/mutation.sh \
            | sed -E "s|.*'!?\*\*/(.+)'|\1|" \
            | while read -r entry; do
                grep -q "/$entry\$" "$RUNNER_TEMP/mutated.txt" \
                  || echo "::error::scripts/mutation.sh names $entry, which no project reports"
              done > "$RUNNER_TEMP/missing.txt"

          cat "$RUNNER_TEMP/missing.txt"
          [ ! -s "$RUNNER_TEMP/missing.txt" ] || invalid=1

          exit "$invalid"

      # The fourth endpoint document README.md's badges read, in the same flat colour as the other
      # three: a colour scale would say a score is good or bad, which is what turns a measurement
      # into a target. Only on main — which, given the triggers above, means a workflow_dispatch of
      # this workflow on main; a pull request's score belongs to the pull request.
      #
      # The `metrics` job owns the other three documents and force-pushes the same branch, so this
      # step reads them back in and carries them forward, exactly as that job does for this one.
      - name: Publish the mutation badge document
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          git fetch --depth=1 origin badges 2>/dev/null \
            && git archive origin/badges | tar -x -C "$RUNNER_TEMP/badges" \
            || true

          jq -n --arg color "blue" '
            [inputs | .files[].mutants[].status] as $status
            | ($status | map(select(. == "Killed" or . == "Timeout")) | length) as $detected
            | ($detected + ($status | map(select(. == "Survived" or . == "NoCoverage")) | length)) as $valid
            | {schemaVersion: 1, label: "mutation score",
               message: (if $valid == 0 then "none" else "\(($detected * 1000 / $valid | round) / 10)%" end),
               color: $color}
          ' StrykerOutput/*/reports/mutation-report.json > "$RUNNER_TEMP/badges/mutation.json"

          cd "$RUNNER_TEMP/badges"
          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "mutation score of ${GITHUB_SHA}"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
